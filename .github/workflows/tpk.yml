name: TPK Updater

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install deps
      run: |
        pip install --upgrade pip
        pip install selectolax playwright httpx[http2] pytz
        playwright install --with-deps chromium

    - name: Run script
      env:
        TPK_BASE_URL: ${{ secrets.TPK_BASE_URL }}
      run: |
        python tpk.py

    - name: Commit & Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "TPK auto $(date)" || echo "No changes"
        git pull --rebase
        git push

    - name: Pull latest changes
      run: git pull --rebase origin main    
