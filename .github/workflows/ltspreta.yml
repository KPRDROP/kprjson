name: LTSPRETA Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install selectolax playwright httpx[http2] pytz
          playwright install --with-deps
          playwright install chromium

      - name: Run scraper
        env:
          LTSPRETA_API_URL: ${{ secrets.LTSPRETA_API_URL }}
        run: |
          python ltspreta.py

      - name: Commit & push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add ltspreta_vlc.m3u8 ltspreta_tivimate.m3u8

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update LTSPRETA Playlist"

          if ! git push origin main; then
            git stash
            git pull --rebase origin main
            git stash pop
            git add ltspreta_vlc.m3u8 ltspreta_tivimate.m3u8
            git commit -m "Update LTSPRETA Playlist (rebased)" || true
            git push origin main
          fi
