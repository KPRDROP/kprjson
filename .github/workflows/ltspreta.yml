name: LTSPRETA Updater

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright httpx[http2] pytz
        
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps
        
    - name: Verify secrets
      run: |
        if [ -z "${{ secrets.LTSPRETA_API_URL }}" ]; then
          echo "LTSPRETA_API_URL secret is not set"
          exit 1
        fi
        echo "LTSPRETA_API_URL is set"
        
    - name: Run LTSPRETA updater
      env:
        LTSPRETA_API_URL: ${{ secrets.LTSPRETA_API_URL }}
      run: |
        python -c "from ltspreta import run; run()"
        
    - name: Check for output files
      id: check_files
      run: |
        if [ -f ltspreta_vlc.m3u8 ] && [ -f ltspreta_tivimate.m3u8 ]; then
          echo "files_exist=true" >> $GITHUB_OUTPUT
          echo "Found output files"
          echo "VLC file size: $(wc -c < ltspreta_vlc.m3u8) bytes"
          echo "TiviMate file size: $(wc -c < ltspreta_tivimate.m3u8) bytes"
          echo "Channel count in VLC: $(grep -c '#EXTINF' ltspreta_vlc.m3u8)"
        else
          echo "files_exist=false" >> $GITHUB_OUTPUT
          echo "No output files found"
        fi
        
    - name: Commit and push changes
      if: steps.check_files.outputs.files_exist == 'true'
      run: |
        if [[ -n $(git status --porcelain ltspreta_vlc.m3u8 ltspreta_tivimate.m3u8) ]]; then
          echo "Changes detected, committing..."
          
          
          git pull --rebase origin main || true
          
          git add ltspreta_vlc.m3u8 ltspreta_tivimate.m3u8
          
          git commit -m "Update LTSPRETA Playlist - $(date '+%Y-%m-%d %H:%M:%S')"
          
          git push origin main
          
          echo "Successfully pushed changes"
          echo "Updated with $(grep -c '#EXTINF' ltspreta_vlc.m3u8) channels"
        else
          echo "No changes to commit"
        fi
