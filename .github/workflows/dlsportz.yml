name: DLSPORTZ Streams updater

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dlsportz-updater
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright selectolax aiohttp httpx[http2] pytz

      - name: Run DLSPORTZ updater
        run: |
          python -c "from dlsportz import main; import asyncio; asyncio.run(main())"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f dlsportz_vlc.m3u8 dlsportz_tivimate.m3u8 cache_DLSPORTZ.json cache_DLSPORTZ-api.json 2>/dev/null || true

          if git status --porcelain | grep -q .; then
            echo "Changes detected, committing..."
            git commit -m "chore: update DLSPORTZ streams [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes to commit"
          fi
