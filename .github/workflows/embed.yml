name: EMBED Stream Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  EMBED_BASE_URL: ${{ secrets.EMBED_BASE_URL }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2t64 \
            libgbm1 \
            libxkbcommon0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libcups2 \
            libdrm2 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxcb1 \
            libxfixes3 \
            libxshmfence1 \
            libwayland-client0 \
            libpango-1.0-0 \
            libcairo2 \
            libgdk-pixbuf2.0-0 \
            libgtk-3-0 || true
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright gitpython requests httpx[http2] pytz
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium || true
      
      - name: Run EMBED scraper
        run: python embed.py
        continue-on-error: true
      
      - name: Commit and push changes
        if: always()
        run: |
          # Configure git with the correct user
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Set remote URL with token for authentication
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Pull latest changes first
          git pull origin ${{ github.ref_name }} --rebase --allow-unrelated-histories || true
          
          # Add playlist files and caches
          git add embed_vlc.m3u8 embed_tivimate.m3u8 caches/ || true
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update EMBED streams $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin ${{ github.ref_name }}
            echo "Successfully pushed changes"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
