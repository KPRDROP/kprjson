name: PITS updater

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install selectolax playwright httpx[http2] pytz
          playwright install --with-deps chromium

      - name: Run PITS updater
        run: |
          python pits.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if pits.m3u8 exists
          if [ ! -f "pits.m3u8" ]; then
            echo "pits.m3u8 not found"
            exit 1
          fi
          
          # Add the file
          git add pits.m3u8
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit the changes
          git commit -m "Update PITS playlist [skip ci]"
          
          # Pull latest changes with rebase and push
          for i in 1 2 3; do
            echo "Push attempt $i..."
            if git pull --rebase origin main; then
              if git push origin main; then
                echo "Changes pushed successfully"
                exit 0
              else
                echo "Push failed, will retry..."
              fi
            else
              echo "Pull/rebase failed, will retry..."
            fi
            sleep 2
          done
          
          echo "Failed to push after 3 attempts"
          exit 1
