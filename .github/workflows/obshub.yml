name: OBSHUB Updater

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selectolax aiohttp
    
    - name: Run OBSHUB updater
      run: |
        python obshub.py
    
    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Fetch and merge remote changes
        git fetch origin
        git merge origin/${GITHUB_REF#refs/heads/} --no-edit --allow-unrelated-histories || true
        
        # Add files
        git add obshub_vlc.m3u8 obshub_tivimate.m3u8 *.cache 2>/dev/null || true
        
        # Commit if changes exist
        if ! git diff --staged --quiet; then
          git commit -m "Update M3U8 files - $(date '+%Y-%m-%d %H:%M:%S') [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
        else
          echo "No changes to commit"
        fi
