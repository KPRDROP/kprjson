name: OBSHUB Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selectolax aiohttpx
    
    - name: Run OBSHUB scraper
      run: |
        python obshub.py
    
    - name: List generated files
      run: |
        echo "Files in current directory:"
        ls -la
        echo ""
        echo "Checking for M3U8 files:"
        ls -la *.m3u8 2>/dev/null || echo "No M3U8 files found"
    
    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Configure git
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        # Set remote URL with token
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
        
        # Fetch latest changes
        git fetch origin
        
        # Switch to main branch
        git checkout ${GITHUB_REF#refs/heads/} || git checkout -b ${GITHUB_REF#refs/heads/}
        
        # Pull latest changes with rebase
        git pull origin ${GITHUB_REF#refs/heads/} --rebase || true
        
        # Force add all M3U8 files and cache files
        git add -f obshub_vlc.m3u8 obshub_tivimate.m3u8 *.cache 2>/dev/null || true
        
        # Check if there are changes to commit
        if git status --porcelain | grep -q .; then
          echo "Changes detected, committing..."
          git status
          git commit -m " Auto-update M3U8 streams [$(date '+%Y-%m-%d %H:%M:%S')]"
          
          # Try to push with force-with-lease
          if git push origin ${GITHUB_REF#refs/heads/} --force-with-lease; then
            echo " Successfully pushed changes"
          else
            echo " Push failed, trying force push..."
            git push origin ${GITHUB_REF#refs/heads/} --force
          fi
        else
          echo " No changes to commit"
          git status
        fi
    
    - name: Verify push
      run: |
        echo "Verifying files in repository after push:"
        git ls-tree HEAD --name-only | grep -E '\.(m3u8|cache)$' || echo "No M3U8 files found in repo"
