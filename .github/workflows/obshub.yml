name: OBSHUB Updater

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selectolax aiohttp httpx[http2] pytz
    
    - name: Run OBSHUB updater
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python obshub.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add obshub_vlc.m3u8 obshub_tivimate.m3u8 *.cache 2>/dev/null || true
        git diff --staged --quiet || git commit -m "Update M3U8 files [skip ci]"
        git push origin HEAD:${GITHUB_REF#refs/heads/}
