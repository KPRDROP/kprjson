name: PUSHEMBDZ Updater

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install playwright httpx[http2] selectolax pytz
          playwright install chromium

      - name: Run updater
        run: python pushembdz.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add pushembdz.m3u8 || true
          
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          
          git commit -m "Update pushembdz playlist [skip ci]"
          
          # Try to push, if fails, pull and retry
          if ! git push origin main 2>/dev/null; then
            echo "Push failed, pulling latest changes..."
            git pull --rebase origin main
            git push origin main
          fi
          
          echo "Changes pushed successfully"
